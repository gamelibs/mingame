<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Game Engine</title>
    <link rel="stylesheet" href="style.css" />

    <script src="./resan/config.global.js"></script>
    <script src="./resan/vendor-animate.js"></script>

</head>

<body>
    
    <div id="site-background"></div>

    <div id="game-container">
        <div id="animation_container">
            <canvas id="canvas"></canvas>
        </div>
        <div id="preload_container">
            <img id="site-logo" src="assets/image/logo.png" alt="Game Logo" />
            <div class="loading-content">
                <div class="loading-text">Loading...</div>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- bundle.js is injected by HtmlWebpackPlugin; do not include it here to avoid double-loading -->
</body>

</html>
